<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cliks — Gracias</title>
<style>
  :root {
    --crema: #fdf6ec;
    --naranja: #ff8a3d;
    --naranja-suave: #ffe4cc;
    --verde: #1a9c5c;
    --azul: #2f6fed;
    --tinta: #2b2320;
    --tinta-suave: rgba(43,35,32,0.62);
    --tarjeta-borde: rgba(43,35,32,0.08);
  }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--crema);
    color: var(--tinta);
    position: relative; overflow: hidden;
  }
  .mancha {
    position: absolute; border-radius: 50%; z-index: 0;
    width: 380px; height: 380px; background: var(--naranja-suave);
    top: -100px; right: -120px;
  }
  .tarjeta {
    background: white; border: 1px solid var(--tarjeta-borde);
    border-radius: 22px; padding: 46px 42px; max-width: 420px; text-align: center;
    box-shadow: 0 20px 50px -30px rgba(43,35,32,0.25);
    position: relative; z-index: 1;
  }
  .check {
    width: 60px; height: 60px; border-radius: 50%; margin: 0 auto 22px;
    background: var(--verde); display: flex; align-items: center; justify-content: center;
    font-size: 28px; color: white;
  }
  h1 { font-size: 23px; margin: 0 0 10px; letter-spacing: -0.02em; }
  p { color: var(--tinta-suave); font-size: 14px; line-height: 1.55; margin: 0 0 26px; }
  a {
    display: inline-block; padding: 13px 24px; border-radius: 12px;
    background: var(--azul); color: white; text-decoration: none; font-weight: 700; font-size: 14.5px;
  }
</style>
</head>
<body>
  <div class="mancha"></div>
  <div class="tarjeta">
    <div class="check">✓</div>
    <h1>¡Listo, ya quedaste suscrito!</h1>
    <p>Baja la app y entra con el mismo correo que usaste para pagar — tu cuenta ya va a aparecer activa.</p>
    <a href="https://github.com/femjwdnked/ConsultasSAT-descargas/releases/latest">Descargar Consultas SAT</a>
  </div>
</body>
</html>
