  .banda { height: 70px; background: linear-gradient(120deg, #16257a, #3b2aa8); position: relative; flex: none; }
  .banda::before, .banda::after { content: ""; position: absolute; bottom: 100%; background: #4fc3ff; border-radius: 160px 160px 0 0; }
  .banda::before { left: 8%; width: min(26vw, 330px); height: 60px; }
  .banda::after { right: 10%; width: min(19vw, 250px); height: 40px; background: #8fd3ff; border-radius: 130px 130px 0 0; }

  @keyframes aparece { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @media (max-width: 560px) {
