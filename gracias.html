<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cliks — Gracias</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, Helvetica, sans-serif;
    background: #f5f8ff;
    color: #1c2430;
  }
  .tarjeta {
    background: white; border: 1px solid #eceff3;
    border-radius: 14px; padding: 46px 42px; max-width: 420px; text-align: center;
    box-shadow: 0 20px 50px -30px rgba(16,24,40,0.25);
  }
  .check {
    width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 22px;
    background: #e6f4ea; display: flex; align-items: center; justify-content: center;
  }
  h1 { font-size: 22px; font-weight: 800; margin: 0 0 10px; letter-spacing: -0.01em; color: #101828; }
  p { color: #667085; font-size: 14px; line-height: 1.55; margin: 0 0 26px; }
  a {
    display: inline-block; padding: 13px 24px; border-radius: 8px;
    background: #2f6fed; color: white; text-decoration: none; font-weight: 700; font-size: 14.5px;
  }
</style>
</head>
<body>
  <div class="tarjeta">
    <div class="check">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1a9c5c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4 10-10"/></svg>
    </div>
    <h1>¡Listo, ya quedaste suscrito!</h1>
    <p>Baja la app y entra con el mismo correo que usaste para pagar — tu cuenta ya va a aparecer activa.</p>
    <a href="#" id="link-descargar">Descargar Consultas SAT</a>
    <div id="texto-descarga-otro" style="margin-top:12px; font-size:12px; color:#98a2b3;"></div>
  </div>
  <script>
    const BASE_DESCARGAS = "https://github.com/femjwdnked/ConsultasSAT-descargas/releases/latest/download/";
    const ES_MAC = /Mac/.test(navigator.platform) || /Macintosh/.test(navigator.userAgent);
    const ARCHIVO_PROPIO = ES_MAC ? "ConsultasSAT-Mac.zip" : "ConsultasSAT.exe";
    const ARCHIVO_OTRO = ES_MAC ? "ConsultasSAT.exe" : "ConsultasSAT-Mac.zip";
    const TEXTO_OTRO = ES_MAC ? "¿Usas Windows? Descárgala aquí" : "¿Usas Mac? Descárgala aquí";

    document.getElementById("link-descargar").href = BASE_DESCARGAS + ARCHIVO_PROPIO;
    document.getElementById("texto-descarga-otro").innerHTML =
      `<a href="${BASE_DESCARGAS}${ARCHIVO_OTRO}" style="background:none; padding:0; color:#98a2b3; text-decoration:underline; font-weight:400; font-size:12px;">${TEXTO_OTRO}</a>`;
  </script>
</body>
</html>
